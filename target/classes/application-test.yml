# 测试环境配置
server:
  port: 0  # 随机端口

spring:
  # 测试环境数据库配置（使用H2内存数据库）
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  
  # JPA测试环境配置
  jpa:
    hibernate:
      ddl-auto: create-drop  # 测试环境每次重新创建表
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true
        format_sql: true
  
  # Flyway测试环境配置
  flyway:
    enabled: false  # 测试环境禁用Flyway，使用JPA自动建表
  
  # H2控制台配置（仅测试环境）
  h2:
    console:
      enabled: true
      path: /h2-console

# 测试环境日志配置
logging:
  level:
    com.example.mydataplatform: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    root: INFO

# 测试环境监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
